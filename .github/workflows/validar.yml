name: Revisión automática

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar el convertidor de Diputados con casos difíciles
        run: python pruebas/test_diputados.py
      - name: Probar la lectura de los índices de Diputados
        run: python pruebas/test_vigilante.py
      - name: Revisar corpus, catálogo, huellas y artículos de control
        run: python herramientas/validar.py
      - name: Probar la consulta y el verificador de citas
        run: python pruebas/test_consulta.py
